name: Update MPA data and publish
on:
  schedule:
    - cron: "0 1 * * *"        # 09:00 SGT daily: Copernicus forecast refresh (MPA/NEA re-checked too)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "data/land.json", "data/johor_channels.json", "scripts/build.py"]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl numpy copernicusmarine
      - name: Download MPA tidal atlas currents
        if: github.event_name != 'push'
        run: python scripts/fetch_mpa.py || echo "MPA fetch failed, keeping previous data"
      - name: Update Tanjong Pagar tide tables (NEA)
        if: github.event_name != 'push'
        run: python scripts/fetch_tide.py
      - name: Copernicus Marine surface currents (Malacca to mid South China Sea)
        if: github.event_name != 'push'
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: python scripts/fetch_cmems.py || echo "Copernicus fetch failed, keeping previous data"
      - run: python scripts/fit.py
      - run: python scripts/build.py
      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mpa_data.json data/sg_tide.json data/cmems.json 2>/dev/null || git add data/mpa_data.json data/sg_tide.json
          git diff --cached --quiet || git commit -m "Data refresh $(date -u +%Y-%m-%d)"
          git push || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
